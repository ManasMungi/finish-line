<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finish Line — training plan and race predictions</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13203A">
<meta name="application-name" content="Finish Line">
<meta name="apple-mobile-web-app-title" content="Finish Line">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#13203A; --muted:#58647C; --line:#D8DEE8;
  --track:#2456A6; --track-soft:#E3EBF8; --on-track:#FFFFFF;
  --clock:#F2B705; --hero:#13203A; --hero-ink:#E9EEF6; --hero-muted:#9DAAC2;
  --good:#1C8456; --warn:#A8510A; --faint:#8C96A8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1524; --surface:#132036; --ink:#E7ECF4; --muted:#9BA8BF; --line:#26354F;
    --track:#6B98F0; --track-soft:#1B2D4D; --on-track:#0C1524;
    --clock:#F6C631; --hero:#070E1A; --hero-ink:#E7ECF4; --hero-muted:#8D9AB2;
    --good:#4CC38A; --warn:#F0A257; --faint:#66738C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1524; --surface:#132036; --ink:#E7ECF4; --muted:#9BA8BF; --line:#26354F;
  --track:#6B98F0; --track-soft:#1B2D4D; --on-track:#0C1524;
  --clock:#F6C631; --hero:#070E1A; --hero-ink:#E7ECF4; --hero-muted:#8D9AB2;
  --good:#4CC38A; --warn:#F0A257; --faint:#66738C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,.clock,h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--clock);outline-offset:2px;border-radius:4px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.45rem;letter-spacing:.01em}
.brand svg{flex:none;border-radius:8px}
.brand span{display:flex;flex-direction:column;line-height:1}
.brand-tag{font-family:"Barlow",system-ui,sans-serif;font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:2px}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--track);color:var(--on-track)}
nav.tabs a:hover:not([aria-current="page"]){background:var(--track-soft);color:var(--ink)}
.sync{font-size:.8rem;color:var(--faint);width:100%;text-align:right;margin-top:-6px}
@media (min-width:760px){.sync{width:auto;margin:0}}

main{max-width:1040px;margin:0 auto;padding:24px 20px 64px}
section.view{display:none}
section.view.active{display:block}
h2{font-size:1.55rem;font-weight:600;margin:0 0 4px;line-height:1.2}
h3{font-size:1.2rem;font-weight:600;margin:0 0 8px}
p{margin:0 0 12px}
.lede{color:var(--muted);margin-bottom:20px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:20px}
.grid2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* finish clock hero */
.clockboard{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:22px 22px 18px;position:relative;overflow:hidden}
.clockboard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.06) calc(25% - 1px) 25%);pointer-events:none}
.clockboard>*{position:relative}
.clock-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.clock-head p{margin:0;color:var(--hero-muted)}
.clocks{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:700px){.clocks{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
.clock-cell{padding:8px 0 4px;border-top:1px solid rgba(255,255,255,.12)}
.clock-cell .label{display:flex;align-items:center;gap:8px;color:var(--hero-muted);font-weight:500}
.goalflag{font-size:.75rem;background:var(--clock);color:#13203A;padding:1px 8px;border-radius:999px;font-weight:600}
.clock{font-size:clamp(3rem,9vw,4.4rem);font-weight:600;line-height:1;color:var(--clock);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin:4px 0}
@media (min-width:700px) and (max-width:900px){.clock{font-size:clamp(2.4rem,5.4vw,3.2rem)}.scen b{font-size:1.25rem}}
.clock.dim{color:var(--hero-muted)}
.clock-sub{color:var(--hero-muted);font-size:.95rem}
.clock-sub b{color:var(--hero-ink);font-weight:600}
.range{position:relative;height:4px;margin:14px 0 10px;border-radius:999px;background:linear-gradient(90deg,var(--clock),rgba(255,255,255,.18))}
.range-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--clock);box-shadow:0 0 0 3px var(--hero)}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scen div{display:flex;flex-direction:column;line-height:1.25}
.scen div:last-child{text-align:right}
.scen span{color:var(--hero-muted);font-size:.85rem}
.scen b{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:600;color:var(--hero-ink)}
.conf{display:inline-flex;gap:6px;align-items:center}
.conf i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hero-muted)}
.conf i.on{background:var(--clock)}
.hero-empty{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--track)}
.btn.primary{background:var(--track);border-color:var(--track);color:var(--on-track)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.onhero{background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.3)}
.btn.onhero.primary{background:var(--clock);color:#13203A;border-color:var(--clock)}
.btn.danger{color:var(--warn)}
.iconbtn{border:none;background:none;cursor:pointer;color:var(--faint);padding:6px;border-radius:6px}
.iconbtn:hover{color:var(--warn);background:var(--track-soft)}

/* week strip */
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.progress{height:8px;background:var(--track-soft);border-radius:999px;overflow:hidden;margin:10px 0 16px}
.progress span{display:block;height:100%;background:var(--track);border-radius:999px;transition:width .4s}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 6px;min-height:96px;display:flex;flex-direction:column;gap:2px;font-size:.82rem}
.day .dow{color:var(--muted);font-weight:500}
.day .dkm{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.day .dtype{color:var(--muted);line-height:1.2}
.day.today{border-color:var(--track);box-shadow:inset 0 0 0 1px var(--track)}
.day.done{background:var(--track-soft)}
.day.done .dkm{color:var(--track)}
.day.missed .dkm,.day.missed .dtype{color:var(--faint);text-decoration:line-through}
.day.rest .dkm{color:var(--faint)}
.tick{color:var(--good);font-weight:600}
.shoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.shoe{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.shoe.soon{border-color:var(--clock)}
.shoe.due{border-color:var(--warn)}
.shoe-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shoe-flag{font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--clock);color:#13203A}
.shoe.due .shoe-flag{background:var(--warn);color:#fff}
.shoe-name{font-size:1.02rem;margin-top:4px}
.shoe-km{font-size:1.7rem;font-weight:600;line-height:1.1}
.shoe-bar{margin:6px 0 8px}
.shoe.soon .shoe-bar span{background:var(--clock)}
.shoe.due .shoe-bar span{background:var(--warn)}
.picks{margin-top:8px;font-size:.88rem}
.picks summary{cursor:pointer;color:var(--track);font-weight:500}
.picks ul{margin:0;padding-left:18px}
.shoetable input,.shoetable select{min-width:0}
.shoetable td{vertical-align:middle}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--clock);text-decoration:underline;cursor:pointer}
.status-label{font-family:"Barlow Condensed",sans-serif;font-size:2.6rem;font-weight:600;line-height:1}
.status-score .num{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-weight:600}
.next-title{font-family:"Barlow Condensed",sans-serif;font-size:1.9rem;font-weight:600;line-height:1.1;margin-top:4px}
.next-title .num{color:var(--track)}
.next .tgt{font-size:.92rem}
.status-head{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring-val{animation:ringfill 1s ease-out}
@keyframes ringfill{from{stroke-dasharray:0 var(--ring)}}
.ring-num{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:600;fill:var(--ink)}
.sdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 6px}
.sday{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:.78rem;color:var(--muted);transition:transform .15s,border-color .15s}
.sday b{font-size:1.05rem;color:var(--ink)}
.sday:hover{transform:translateY(-2px);border-color:var(--track)}
.sday.done{background:var(--track);border-color:var(--track);color:var(--on-track)}
.sday.done b{color:var(--on-track)}
.sday.extra{border-color:var(--track);border-style:dashed}
.sday.short{border-color:var(--clock);background:var(--track-soft)}
.sday.missed{border-color:var(--warn)}
.sday.missed b{color:var(--warn)}
.sday.is-today{box-shadow:0 0 0 2px var(--clock)}
.sday.sel{outline:2px solid var(--ink);outline-offset:1px}
.sday-detail{min-height:2.6em;margin:4px 0 10px}
.xrow{border-top:1px solid var(--line)}
.xrow summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:10px 0}
.xrow summary::-webkit-details-marker{display:none}
.xrow summary:hover .num{color:var(--track)}
.xval{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:90px}
.ptbar{width:80px;height:5px;border-radius:999px;background:var(--track-soft);overflow:hidden}
.ptbar span{display:block;height:100%;background:var(--track);border-radius:999px;transition:width .6s}
.xbody{padding:0 0 12px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
svg.mini{width:100%;max-width:340px;height:auto;display:block}
svg.mini text{fill:var(--muted);font-size:10px;font-family:"Barlow",sans-serif}
@media (prefers-reduced-motion:reduce){.ring-val,.xbody{animation:none}}
.srow{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.srow:first-child{border-top:none}
.srow.rest{grid-template-columns:110px 1fr;color:var(--muted)}
.srow.now{background:var(--track-soft);margin:0 -20px;padding:14px 20px;border-radius:10px}
.srow.test b{color:var(--track)}
.srow.done{opacity:.8}
.sday-name{font-weight:600;font-size:.92rem}
.sstatus{text-align:right;min-width:110px}
@media (max-width:600px){.srow,.srow.rest{grid-template-columns:1fr}.sstatus{text-align:left}}
.clocks.four{grid-template-columns:1fr 1fr}
@media (min-width:900px){.clocks.four{grid-template-columns:repeat(4,minmax(0,1fr))}.clocks.four .clock{font-size:clamp(2.2rem,3.6vw,3.2rem)}}
.morebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.quicklog{margin-top:16px;padding:14px;border-radius:12px;background:var(--track-soft)}
.ql-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ql-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ql-grid input{background:var(--surface)}
@media (max-width:480px){.ql-grid{grid-template-columns:1fr 1fr}}
.next-after{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.projtable .chance{font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;font-weight:600}
.chancebar{height:5px;background:var(--track-soft);border-radius:999px;overflow:hidden;margin:3px 0 2px auto;max-width:110px}
.chancebar span{display:block;height:100%;border-radius:999px}
.projtable .proj{font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;font-weight:600;color:var(--track)}
.projtable td{vertical-align:middle}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.rc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc-when{font-size:1.2rem;font-weight:600;color:var(--track);white-space:nowrap}
.rc-why{margin:10px 0 8px}
.rc-dists{display:flex;gap:6px;flex-wrap:wrap}
.typechip.on{background:var(--track);color:var(--on-track)}
.rcard .btn{margin-top:auto;align-self:flex-start}
.sugg-head{font-weight:500;font-size:.92rem;margin:0 0 6px}
.sugg-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sugg{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.sugg span{font-size:.82rem;color:var(--muted)}
.sugg:hover{border-color:var(--track)}
.sugg[aria-pressed="true"]{border-color:var(--track);background:var(--track-soft)}
.tgt{font-size:.85rem;margin-top:4px;color:var(--muted)}
.tgt b{color:var(--ink);font-weight:600}
.heat{color:var(--warn);font-weight:500}
.dwx{font-size:.75rem;color:var(--muted)}
.dswim{font-size:.78rem;color:var(--track);font-weight:500}
@media (max-width:560px){
  .days{grid-template-columns:1fr}
  .day{min-height:0;flex-direction:row;align-items:baseline;gap:10px;padding:8px 12px}
  .day .dow{width:36px}
  .day .dkm{width:64px}
}
.today-card{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--track-soft)}
.today-card p{margin:0}

/* tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.88rem}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.paces td:first-child{font-weight:600}
.paces td.num{font-size:1.15rem}

/* why list */
.factors{list-style:none;padding:0;margin:0}
.factors li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.factors li:last-child{border-bottom:none}
.pen{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pen.zero{color:var(--good)}
.pen.plus{color:var(--warn)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:"Barlow",sans-serif;font-size:12px}
svg.chart.six text.bv{fill:var(--ink);font-weight:600;font-size:13px}
svg.chart.six text.ph{font-size:11px}
svg.chart.six text.rflag{fill:var(--warn);font-size:11px;font-weight:600}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--track);display:inline-block}
.sw.plan{background:none;border:1.5px dashed var(--track)}

/* forms */
.form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.92rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--track);outline:none;box-shadow:0 0 0 3px var(--track-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;padding:9px 16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--track);color:var(--on-track)}
.err{color:var(--warn);font-size:.9rem;min-height:1.3em;margin:0}
.ok{color:var(--good)}
.swimchip{background:transparent;border:1px solid var(--track);color:var(--track)}
.typechip{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--track-soft);color:var(--ink);white-space:nowrap}

/* plan */
.builtfor{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.plan-summary{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:6px}
.plan-summary div{display:flex;flex-direction:column}
.plan-summary .num{font-size:1.7rem;font-weight:600;line-height:1.1}
details.wk{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
details.wk[open]{border-color:var(--track)}
details.wk summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:110px 1fr auto auto;gap:14px;align-items:center}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .num{font-size:1.2rem;font-weight:600}
.phase{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);justify-self:start}
.phase.Base{border-color:var(--line)}
.phase.Build{border-color:var(--track);color:var(--track)}
.phase.Peak{background:var(--track);border-color:var(--track);color:var(--on-track)}
.phase.Taper{border-style:dashed}
.phase.Race{background:var(--clock);border-color:var(--clock);color:#13203A}
.wk-days{padding:0 16px 12px}
.wk-days .row{display:grid;grid-template-columns:48px 70px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.wk-days .row .num{font-size:1.05rem;font-weight:600}
@media (max-width:560px){
  details.wk summary{grid-template-columns:1fr auto;row-gap:4px}
  details.wk summary .lr{display:none}
}
.note{font-size:.88rem;color:var(--muted);margin-top:14px;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">

/* ---------- state ---------- */

function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); return raw ? normalize(JSON.parse(raw)) : null; }catch(e){ return null; } }

let dbDoc = null, saveTimer = null;

/* ---------- dates & formatting ---------- */

function dowIdx(d){ return (d.getDay()+6)%7; }
function shortDate(d){ return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fmtHMS(min){
  if(!isFinite(min)) return "–:––:––";

  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
function fmtPace(minPerKm){
  if(!isFinite(minPerKm)) return "–";

  let s = Math.round(v*60); const m = Math.floor(s/60); s -= m*60;

}
function unit(){ return state.profile.units; }
function dist(km, dp){ const v = unit()==="mi" ? km/MI : km; return v.toFixed(dp === undefined ? 1 : dp); }

/* ---------- running science (Daniels/Gilbert) ---------- */
const vo2 = v => -4.60 + 0.182258*v + 0.000104*v*v;                 // v in m/min

/* ---------- shoes ---------- */

function shoeStats(sh){
  const t = today0(), runs = runsOnly().filter(r => { const x = shoeOfRun(r); return x && x.id === sh.id; });

/* ---------- heart rate & weather ---------- */
// zones as [fraction of max HR] and [fraction of heart-rate reserve, used when resting HR is known]
const HRZ = {recovery:[[.60,.70],[.50,.62]], easy:[[.65,.78],[.59,.74]], steady:[[.75,.85],[.68,.80]], mp:[[.80,.87],[.75,.84]], hmp:[[.85,.90],[.80,.87]],
  t:[[.88,.92],[.84,.89]], i:[[.95,1],[.93,1]], "5k":[[.95,.98],[.93,.97]], "10k":[[.92,.96],[.89,.94]], half:[[.85,.90],[.80,.87]], full:[[.80,.87],[.75,.84]]};

const WX_KEY = "finishline:weather";
let weather = null, wxError = false;
try{ weather = JSON.parse(localStorage.getItem(WX_KEY) || "null"); }catch(e){ weather = null; }

      const res = g.results || [];
      geo = res.find(r => want && (`${r.admin1 || ""} ${r.country || ""}`).toLowerCase().includes(want)) || res[0];
      if(!geo) throw new Error("place not found");

function sampleRuns(){
  const t = today0(), runs = [], v = 44, rnd = () => (Math.random()-.5);
  const P = {easy: paceAt(v,.64), long: paceAt(v,.655), tempo: paceAt(v,.83)};
  for(let w=6; w>=0; w--){
    const mon = addDays(mondayOf(t), -7*w);
    const add = (d, km, type, pace, notes) => { const date = addDays(mon,d); if(date > t) return; runs.push({id:uid(), date:iso(date), km:+km.toFixed(2), min:+(km*pace*(1+rnd()*.05)).toFixed(2), type, notes:notes||"", hr:({easy:142,long:146,tempo:166,intervals:158,race:174})[type] + Math.round(rnd()*8)}); };
    add(1, 8 + rnd()*2, "intervals", paceAt(v,.74), "6×800 m");
    add(2, 7 + rnd()*2, "easy", P.easy);
    add(3, 7 + rnd(), "tempo", P.tempo, "Tempo portion only");
    add(5, 6 + rnd()*2, "easy", P.easy);
    if(w <= 2){ const sd = addDays(mon,4); if(sd <= t) runs.push({id:uid(), sport:"swim", date:iso(sd), km:1.5, min:+(31 + rnd()*3).toFixed(2), type:"pool", notes:"Easy aerobic", hr:128 + Math.round(rnd()*8)}); }
    if(w === 2) add(6, 10, "race", raceTime(v,10)/10, "Local 10K");
    else add(6, 14 + (6-w)*1.3 + rnd(), "long", P.long);
  }
  return runs;
}

// Race-day projection: today’s fitness, with the endurance slowdown recalculated for the weekly distance
// and long run the plan builds you up to before that race. No fitness gain is assumed.
function projectRace(r, pred){
  const km = DIST[r.dist].km, weeks = Math.max(0, Math.round((parseD(r.date) - today0())/(7*DAY)));
  const v = pred.fit.vdot, spread = [0, 2.8, 1.8, 1.0][pred.fit.conf];
  const full = r.dist === "full", half = r.dist === "half";
  if(!full && !half){
    const t = raceTime(v, km);
    return {weeks, today:t, proj:t, amb:raceTime(v + spread, km), worst:raceTime(v - spread, km)*1.01};
  }
  const base = Math.max(15, pred.vol.weekly), build = Math.max(0, weeks - (full ? 3 : 2));
  const wk = Math.min(full ? clamp(base*1.5, 45, 95) : clamp(base*1.4, 30, 70), base*Math.pow(1.07, build));
  const lg = Math.max(pred.vol.long42, Math.min(full ? 32 : 19, pred.vol.long42 + 1.6*build));
  const pen = full ? clamp((60 - wk)*.0025, 0, .10) + clamp((30 - lg)*.004, 0, .08) : clamp((35 - wk)*.002, 0, .05) + clamp((16 - lg)*.004, 0, .04);
  return {weeks, wk, lg, today: full ? pred.fm : pred.hm, proj: raceTime(v, km)*(1 + pen),
    amb: raceTime(v + spread, km)*(1 + pen*.5), worst: raceTime(v - spread, km)*(1 + pen*1.5 + (full ? .03 : .01))};
}
// Chance of beating a goal: race-day time treated as a skewed bell curve around the projection,
// with the ambitious time as the 10th percentile and the worst case as the 90th.
function normCdf(z){ const t = 1/(1 + .2316419*Math.abs(z)), d = .3989423*Math.exp(-z*z/2);
  const p = d*t*(.3193815 + t*(-.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274)))); return z > 0 ? 1 - p : p; }
function goalChance(p, goal){
  const lo = Math.max(1e-4, Math.log(p.proj/p.amb)/1.2816), hi = Math.max(1e-4, Math.log(p.worst/p.proj)/1.2816);
  const x = Math.log(goal/p.proj);
  return normCdf(x / (x < 0 ? lo : hi));
}
function chanceHtml(c){
  const pct = Math.round(c*100), shown = pct < 1 ? "<1%" : pct > 99 ? ">99%" : pct + "%";
  const [label, color] = c >= .8 ? ["Very likely", "var(--good)"] : c >= .5 ? ["Likely", "var(--good)"] : c >= .2 ? ["Possible", "var(--clock)"] : c >= .05 ? ["A stretch", "var(--warn)"] : ["Unlikely", "var(--warn)"];
  return `<span class="num chance" style="color:${color}">${shown}</span><div class="chancebar"><span style="width:${Math.max(2, Math.min(100, pct))}%;background:${color}"></span></div><div class="muted small">${label}</div>`;
}
function racesPanel(pred){
  const up = upcomingRaces(); if(!up.length) return "";
  const tr = targetRace();
  if(!pred) return `<div class="panel"><h3>Projected finish times</h3><p class="muted" style="margin:0">Projections for your ${up.length} upcoming race${up.length>1?"s":""} appear with your first weekly prediction.</p></div>`;
  const rows = up.map(r => {
    const p = projectRace(r, pred), km = DIST[r.dist].km, gm = parseDuration(r.goal), isT = tr && tr.id === r.id;
    let gap = "";
    if(gm > 10){ const d = p.proj - gm; gap = Math.abs(d) < .5 ? `<span class="pen zero">on goal</span>` : d > 0 ? `<span class="pen plus">${fmtHMS(d)} off ${esc(r.goal)}</span>` : `<span class="pen zero">${fmtHMS(-d)} under ${esc(r.goal)}</span>`; }
    return `<tr>
      <td><b>${esc(raceLabel(r))}</b>${isT ? ` <span class="typechip" style="background:var(--clock);color:#13203A">Main race</span>` : ""}<div class="muted small">${DIST[r.dist].label} · ${fmtDay(parseD(r.date))} · ${p.weeks} week${p.weeks===1?"":"s"} away</div></td>
      <td class="r num">${fmtHMS(p.today)}</td>
      <td class="r"><span class="num proj">${fmtHMS(p.proj)}</span><div class="muted small num">${fmtPace(p.proj/km)}${paceUnit()}</div></td>
      <td class="r num small">${fmtHMS(p.amb)}–${fmtHMS(p.worst)}</td>
      <td class="r small">${gap || '<span class="muted">no goal set</span>'}</td>
      <td class="r" style="min-width:110px">${gm > 10 ? chanceHtml(goalChance(p, gm)) : '<a class="small" href="#settings">Add a goal</a>'}</td></tr>`;
  }).join("");
  return `<div class="panel"><div class="week-head"><h3>Projected finish times</h3><a class="small" href="#settings">Edit races</a></div>
    <div class="scroll"><table class="projtable"><thead><tr><th>Race</th><th class="r">If raced today</th><th class="r">On race day</th><th class="r">Range</th><th class="r">vs goal</th><th class="r">Chance of goal</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">“On race day” keeps today’s fitness and assumes you follow the plan up to each race: weekly distance growing about 7% a week and long runs about ${dist(1.6)} ${unit()} longer each week, until the taper. Faster fitness from that training isn’t counted, so it’s on the cautious side. The range runs from ambitious to worst case. The chance of hitting your goal treats race day as a spread of likely outcomes around the projection, with the ambitious time as a 1-in-10 good day and the worst case as a 1-in-10 bad day. Updated every Monday.</p></div>`;
}

/* ---------- training status & next run ---------- */
let quickMsg = "";
function plannedDay(bi, date){
  for(const pl of [bi.cur, bi.next]) if(pl && !pl.past) for(const w of pl.weeks) for(const d of w.days) if(iso(d.date) === iso(date)) return {d, paces: pl.paces};
  return null;
}
function trainingStatus(bi){
  const t = today0(), runs = runsOnly(), dayKm = ds => runs.filter(r => r.date === ds).reduce((a,r) => a + r.km, 0);
  const ranToday = dayKm(iso(t)) > 0;
  // plan completion over the last 7 days (today counts once you’ve logged it)
  let planned = 0, actual = 0, days = 0, keyPlanned = 0, keyDone = 0;
  for(let i = ranToday ? 0 : 1; i <= (ranToday ? 6 : 7); i++){
    const dt = addDays(t, -i), pd = plannedDay(bi, dt); if(!pd) continue;
    days++; planned += pd.d.km; const got = dayKm(iso(dt)); actual += got;
    if(["long","tempo","interval","mp","race"].includes(pd.d.type)){ keyPlanned++; if(got >= pd.d.km*.7) keyDone++; }
  }
  const adh = days >= 3 && planned > 0 ? actual/planned : null;
  // training load: last 7 days against your average week over the 4 weeks before
  const age = r => (t - parseD(r.date))/DAY;
  const acute = runs.filter(r => age(r) >= 0 && age(r) < 7).reduce((s,r) => s + r.km, 0);
  const chronic = runs.filter(r => age(r) >= 7 && age(r) < 35).reduce((s,r) => s + r.km, 0)/4;
  const load = chronic > 5 ? acute/chronic : null;
  // fitness trend over 4 weeks
  const now = predict(runs, t), before = predict(runs, addDays(t, -28));
  const dV = now && before ? now.fit.vdot - before.fit.vdot : null;
  const sA = adh === null ? 20 : 40*clamp(1 - Math.abs(1 - Math.min(adh, 1.3))*1.5, 0, 1);

function upcomingWeeks(bi){
  const t = today0(), mon = mondayOf(t), plan = {}, isFixed = {};
  [bi.cur, bi.next].forEach(pl => pl && !pl.past && pl.weeks.forEach(w => { plan[iso(w.monday)] = w; isFixed[iso(w.monday)] = true; }));
  if(!bi.cur.past && state.schedule){
    const anchor = parseD(state.schedule.anchor), end = addDays(mon, 42), runs = runsOnly();
    // project later blocks as if you run the plan: each block builds from the 4 weeks before it
    for(let bs = addDays(bi.start, 14); bs < end; bs = addDays(bs, 14)){
      if(isFixed[iso(bs)] && isFixed[iso(addDays(bs, 7))]) continue;
      const prev = [1,2,3,4].map(k => { const m = addDays(bs, -7*k), w = plan[iso(m)];
        return m < mon || !w ? {km: weekKm(runs, m), long: Math.max(0, ...runs.filter(r => { const d = parseD(r.date); return d >= m && d < addDays(m,7); }).map(r => r.km))} : {km: w.total - w.days.filter(d => d.type === "race").reduce((a,d) => a + d.km*.6, 0), long: w.long}; });
      const over = {base: prev.reduce((a,x) => a + x.km, 0)/4, baseLong: Math.max(...prev.map(x => x.long)), peak: Math.max(...prev.map(x => x.km))};
      const pl = buildPlan(bs, bi.cur.cutoff, anchor, 2, over);
      if(pl.past) break;
      pl.weeks.forEach(w => { if(!plan[iso(w.monday)]) plan[iso(w.monday)] = w; });
    }
  }
  const out = [];
  for(let i=0; i<6; i++){
    const m = addDays(mon, 7*i), k = iso(m), w = plan[k];
    if(!w) break;
    out.push({m, w, fixed: !!isFixed[k], cur: i === 0, race: w.days.find(d => d.type === "race"), done: i === 0 ? weekKm(runsOnly(), m) : 0});
  }
  return out;
}
function sixWeekChart(bi){

function volumeChart(bi){
  const known = {};
  [bi.cur, bi.next].forEach(pl => pl && !pl.past && pl.weeks.forEach(w => known[iso(w.monday)] = w.total));
  const t = today0(), mon = mondayOf(t), bars = [];

  }
  const conv = x => unit()==="mi" ? x/MI : x;
  const max = Math.max(10, ...bars.map(b => Math.max(conv(b.actual||0), conv(b.planned||0)))) * 1.15;
  const W = 520, H = 210, pl = 34, pb = 26, pt = 10, iw = W-pl-8, ih = H-pt-pb, bw = iw/bars.length;
  const y = v => pt + ih - conv(v)/max*ih;

  let grid = "";
  for(let g=0; g<=max; g+=step){ const yy = pt + ih - g/max*ih; grid += `<line x1="${pl}" x2="${W-8}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${g}</text>`; }

  const label = full ? "Marathon" : "Half marathon";
  if(vals.length < 2){
    return `<div class="panel"><h3>${label} prediction over time</h3><p class="muted">A trend line appears after two weekly updates.</p></div>`;
  }
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max(2, (hi-lo)*.2); lo -= pad; hi += pad;

  const x = i => pl + i*(iw/(pts.length-1));
  const y = v => pt + (v-lo)/(hi-lo)*ih; // faster (lower) is higher on chart
  let grid = "";
  [lo+pad*.5, (lo+hi)/2, hi-pad*.5].forEach(v => { grid += `<line x1="${pl}" x2="${W-16}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmtHMS(v)}</text>`; });
  let path = "", started = false;
  pts.forEach((p,i) => { if(p.v === null){ started = false; return; } path += `${started?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)} `; started = true; });
  const dots = pts.map((p,i) => p.v === null ? "" : `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.cur?5:3.5}" fill="${p.cur?"var(--clock)":"var(--track)"}" stroke="var(--surface)" stroke-width="1.5"><title>${shortDate(p.ref)}: ${fmtHMS(p.v)}</title></circle>`).join("");
  const labels = pts.map((p,i) => (i%2===1 || p.cur) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" ${p.cur?'style="fill:var(--ink);font-weight:600"':""}>${p.cur?"Latest":shortDate(p.ref)}</text>` : "").join("");
  const first = vals[0], last = vals[vals.length-1], d = last - first;
  const change = Math.abs(d) < .5 ? "Holding steady over 8 weeks." : d < 0 ? `${fmtHMS(-d)} faster than 8 weeks ago.` : `${fmtHMS(d)} slower than 8 weeks ago.`;
  return `<div class="panel"><h3>${label} prediction over time</h3>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} prediction trend">${grid}<path d="${path}" fill="none" stroke="var(--track)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>
    <p class="muted small" style="margin:6px 0 0">${change} Faster is higher.</p></div>`;
}

/* ---------- Strava import (activities.csv from Strava's data export) ---------- */
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((ok, fail) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    sc.onload = () => window.JSZip ? ok(window.JSZip) : fail(); sc.onerror = fail; setTimeout(fail, 20000); document.head.appendChild(sc); });
}
async function importStravaFile(file){
  stravaMsg = "Reading " + file.name + "…"; stravaPreview = null; render();
  try{
    let text;
    if(/\.zip$/i.test(file.name) || /zip/.test(file.type)){
      const JSZip = await loadJSZip().catch(() => { throw "Couldn’t open the zip here. Unzip it on your phone first and choose activities.csv."; });
      const zip = await JSZip.loadAsync(file.arrayBuffer ? await file.arrayBuffer() : file);
      const entry = Object.values(zip.files).find(f => !f.dir && /(^|\/)activities\.csv$/i.test(f.name));
      if(!entry) throw "No activities.csv inside that zip. Make sure it’s the archive Strava emailed you.";
      text = await entry.async("string");
    }else{
      if(file.size > 50*1024*1024) throw "That file is too large for activities.csv. Choose activities.csv from the archive.";
      text = await file.text();
    }
    stravaPreview = readStrava(text);
    if(!stravaPreview.acts.length){ stravaPreview = null; stravaMsg = "!No runs or swims found in that file."; } else stravaMsg = "";
  }catch(m){ stravaPreview = null; stravaMsg = "!" + (typeof m === "string" ? m : "Couldn’t read that file. Try choosing activities.csv directly."); }
  render(); document.getElementById("strava-panel")?.scrollIntoView({block:"start"});
}
let stravaPreview = null, stravaMsg = "", stravaRange = "84";
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function numOf(x){ const n = parseFloat(String(x || "").replace(/,/g, "")); return isFinite(n) ? n : NaN; }
function stravaDate(x){
  const s = String(x || "").trim(); if(!s) return null;
  const iso8 = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(iso8) return `${iso8[1]}-${iso8[2]}-${iso8[3]}`;
  const d = new Date(s.replace(/,(?=\s*\d{1,2}:)/, "") + (/[zZ]|UTC|GMT|[+-]\d{2}:?\d{2}$/.test(s) ? "" : " UTC")); // Strava export times are UTC
  return isNaN(d) ? null : iso(d);
}
function guessType(name, km, hr, hrm){
  const n = (name || "").toLowerCase();
  if(/\brace\b|marathon|\b10k\b|\b5k\b|parkrun|time trial/.test(n)) return "race";
  if(/interval|repeats|\d+\s*[x×]\s*\d+|track|fartlek/.test(n)) return "intervals";
  if(/tempo|threshold|progression/.test(n)) return "tempo";
  // generic names (“Morning Run”): judge the effort from average heart rate
  if(hr && hrm && km >= 4){
    const f = hr / hrm, raceDist = [5, 10, 21.0975, 42.195].some(x => Math.abs(km - x) <= x*.03);
    if(f >= .86 && raceDist) return "race";
    if(f >= .84 && km < 18) return "tempo";
  }

  return "easy";
}
function readStrava(text){
  const rows = parseCSV(text); if(rows.length < 2) throw "That file has no activities in it.";
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = (name, nth=0) => { let k = -1; for(let i=0, seen=0; i<h.length; i++) if(h[i] === name){ if(seen === nth){ k = i; break; } seen++; } return k; };
  const cDate = col("activity date"), cType = col("activity type"), cName = col("activity name"), cId = col("activity id");
  const cDist1 = col("distance"), cDist2 = col("distance", 1), cMove = col("moving time"), cElapsed = col("elapsed time"), cHr = col("average heart rate");
  if(cDate < 0 || cType < 0 || cDist1 < 0) throw "This doesn’t look like Strava’s activities.csv. It needs Activity Date, Activity Type and Distance columns.";
  const out = []; let other = 0;
  const cMax = col("max heart rate", 1) >= 0 ? col("max heart rate", 1) : col("max heart rate");
  const seenMax = rows.slice(1).filter(r => /run/i.test(r[cType] || "")).map(r => numOf(r[cMax])).filter(x => x >= 120 && x <= 230).sort((a,b) => a-b);
  const hrm = hrMax() && !hrMax().est ? hrMax().v : seenMax.length ? seenMax[Math.floor(seenMax.length*.98)] : (hrMax() ? hrMax().v : null);
  for(const r of rows.slice(1)){
    const type = (r[cType] || "").trim().toLowerCase();
    const sport = /swim/.test(type) ? "swim" : /run/.test(type) ? "run" : null;
    if(!sport){ other++; continue; }
    const date = stravaDate(r[cDate]); if(!date) continue;
    // the second Distance column is in metres; the first is in the account's display units (km for runs)
    const m2 = cDist2 >= 0 ? numOf(r[cDist2]) : NaN, d1 = numOf(r[cDist1]);
    let km = m2 > 0 ? m2/1000 : sport === "swim" ? d1/1000 : d1;
    if(!(km > 0)) continue;
    const secs = cMove >= 0 && numOf(r[cMove]) > 0 ? numOf(r[cMove]) : numOf(r[cElapsed]);
    const hrv = cHr >= 0 ? Math.round(numOf(r[cHr])) : NaN, name = cName >= 0 ? (r[cName] || "").trim() : "";

}
function stravaPlan(){
  if(!stravaPreview) return null;
  const cutoff = stravaRange === "all" ? "0000" : iso(addDays(today0(), -Number(stravaRange)));
  const add = [], update = [], same = [];
  for(const a of stravaPreview.acts.filter(a => a.date >= cutoff && a.date <= iso(today0()))){
    if(state.runs.some(r => r.src === a.src)){ same.push(a); continue; }
    const m = state.runs.find(r => !r.src && r.sport === a.sport && r.date === a.date && Math.abs(r.km - a.km) <= Math.max(.3, a.km*.03));
    if(m){ (m.min ? same : update).push(Object.assign({match:m}, a)); } else add.push(a);
  }

}

      ${rows.length ? `<div class="scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Date</th><th>Activity</th><th class="r">Distance</th><th class="r">Time</th><th class="r">Pace</th><th class="r">HR</th></tr></thead><tbody>

      <p class="muted small" style="margin:8px 0">Run types are guessed from each activity’s name, distance and heart rate: “tempo”, “intervals” or “race” in the name, a hard heart rate over a race distance counts as a race, 18 km or more as a long run. You can fix any afterwards.</p>

  }

    <h3>Import from Strava</h3>

    <p class="muted small" style="margin-bottom:10px">On strava.com, go to Settings → My Account → Download or Delete Your Account → Request your archive. Strava emails you a zip within a few hours. Unzip it and choose the <b>activities.csv</b> file inside. Importing again later only adds what’s new.</p>

function paces_rp(plan){ return plan.paces && plan.paces.rp; }

      : plan.paceSrc === "goal" ? `Paces come from your goal time for ${esc(raceLabel(targetRace()))}, since there aren’t enough logged runs yet. Log a few runs and they’ll switch to your actual fitness.`
      : `Log a few runs, or add a goal time to your main race in <a href="#settings">Settings</a>, and a target pace will appear for every run.`}</p>

function racePrediction(r, pred){
  if(!pred) return null;
  if(r.dist === "half") return pred.scen.hm.abs;
  if(r.dist === "full") return pred.scen.fm.abs;
  return raceTime(pred.fit.vdot, DIST[r.dist].km);
}

/* ---------- routing & events ---------- */
const VIEWS = ["overview","log","plan","settings"];
function current(){ const h = location.hash.replace("#",""); return VIEWS.includes(h) ? h : "overview"; }
function render(){
  syncTarget();
  const v = current();
  VIEWS.forEach(n => document.getElementById("view-"+n).classList.toggle("active", n === v));
  document.querySelectorAll("nav.tabs a").forEach(a => { if(a.dataset.view === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  ({overview:renderOverview, log:renderLog, plan:renderPlan, settings:renderSettings})[v]();
}
window.addEventListener("hashchange", () => { dataMsg = ""; logShow = 10; render(); window.scrollTo(0,0); });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-del],[data-set]");
  if(!b) return;
  if(b.dataset.del){
    state.runs = state.runs.filter(r => r.id !== b.dataset.del); persist(); render(); return;
  }
  if(b.dataset.set){
    state.profile[b.dataset.set] = b.dataset.val; persist(); render(); return;
  }
  const act = b.dataset.act;
  if(act === "sample"){
    if(state.runs.length && !confirm("Replace everything you’ve logged with sample activities?")) return;
    state.runs = sampleRuns(); persist(); location.hash = "#overview"; render();
  }else if(act === "clear"){
    if(!confirm("Delete all logged runs and swims? This can’t be undone.")) return;
    state.runs = []; persist(); render();
  }else if(act === "sday"){
    document.querySelectorAll(".sday").forEach(x => x.classList.toggle("sel", x === b));
    const out = document.getElementById("sday-detail"); if(out){ out.textContent = b.dataset.detail; out.classList.remove("muted"); }
  }else if(act === "starter"){
    state.profile.starter = {start: iso(today0()), done:false}; persist();
    if(location.hash === "#plan") render(); else location.hash = "#plan";
  }else if(act === "starterlog"){
    logPrefill = {date: b.dataset.date, type: b.dataset.type, km: Number(b.dataset.km)};
    if(location.hash === "#log") render(); else location.hash = "#log";
  }else if(act === "starterdone"){
    state.profile.starter.done = true; state.schedule = null;
    persist();
    if(location.hash === "#plan") render(); else location.hash = "#plan";
  }else if(act === "starterrace"){
    raceEdit = "new"; raceDraft = {dist:"half", main:true}; location.hash = "#settings";
  }else if(act === "starterquit"){
    if(!confirm("Leave the fitness test week? Runs you’ve logged stay in your log.")) return;
    state.profile.starter = null; persist(); render();
  }else if(act === "logmore"){ logShow += 10; render();
  }else if(act === "logall"){ logShow = 100000; render();
  }else if(act === "logless"){ logShow = 10; render(); document.querySelector("#view-log table")?.scrollIntoView({block:"start"});
  }else if(act === "quicklog"){
    const box = document.getElementById("quicklog"), err = document.getElementById("ql-err"); if(!box) return;
    const dIn = parseFloat(document.getElementById("ql-dist").value), tStr = document.getElementById("ql-time").value.trim();
    const hrRaw = document.getElementById("ql-hr").value.trim(), hr = hrRaw === "" ? null : Math.round(Number(hrRaw));
    const min = tStr ? parseDuration(tStr) : null;
    if(!(dIn > 0) || dIn > 200){ err.textContent = "Enter the distance you ran."; return; }
    if(tStr && !(min > 0 && min < 24*60)){ err.textContent = "Enter the time as mm:ss or h:mm:ss, like 52:30, or leave it blank."; return; }
    if(hr !== null && !(hr >= 40 && hr <= 230)){ err.textContent = "Average heart rate should be between 40 and 230."; return; }
    const km = unit()==="mi" ? dIn*MI : dIn;
    if(min && (min/km < 2.3 || min/km > 20)){ err.textContent = `That’s ${fmtPace(min/km)}${paceUnit()} — check the distance and time.`; return; }
    state.runs.push({id:uid(), sport:"run", date:box.dataset.date, km:+km.toFixed(3), min: min ? +min.toFixed(3) : null, type:box.dataset.type, notes:"", hr, shoe:""});
    if(box.dataset.type === "race" && min && (!state.profile.predRef || box.dataset.date > state.profile.predRef)) state.profile.predRef = box.dataset.date;
    quickMsg = `Logged ${dist(km)} ${unit()}${min ? ` at ${fmtPace(min/km)}${paceUnit()}` : ""}. Nice work.`;
    persist(); render();
  }else if(act === "export"){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}));
    a.download = `finish-line-backup-${iso(today0())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    dataMsg = "Backup saved to your downloads."; render();
  }else if(act === "prednow"){
    state.profile.predRef = iso(today0()); persist(); render();
  }else if(act === "gostrava"){ e.preventDefault(); document.getElementById("strava-file")?.click(); // opens the file picker straight away
  }else if(act === "stravacancel"){ stravaPreview = null; stravaMsg = ""; render();
  }else if(act === "stravaimport"){
    const pl = stravaPlan(); if(!pl) return;
    pl.update.forEach(a => Object.assign(a.match, {min:a.min, hr: a.match.hr || a.hr, src:a.src, notes: a.match.notes && !/past-week list/.test(a.match.notes) ? a.match.notes : a.notes, type: a.match.type === "easy" ? a.type : a.match.type}));
    pl.add.forEach(a => state.runs.push({id:uid(), sport:a.sport, date:a.date, km:a.km, min:a.min, type:a.type, notes:a.notes, hr:a.hr, shoe:"", src:a.src}));
    stravaMsg = `Imported ${pl.add.length} activit${pl.add.length===1?"y":"ies"}${pl.update.length ? ` and filled in ${pl.update.length} run${pl.update.length===1?"":"s"}` : ""} from Strava. Your plan, predictions and shoe distances now include them.`;
    stravaPreview = null; persist(); render();
  }else if(act === "usesugg"){
    const n = document.getElementById("r-name"); if(n) n.value = b.dataset.name;
    document.querySelectorAll(".sugg").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }else if(act === "suggadd"){
    raceEdit = "new"; raceDraft = {name: b.dataset.name, dist: DIST[b.dataset.dist] ? b.dataset.dist : "half", main:false};
    raceMsg = "Pick the date from the official site, then save.";
    if(location.hash === "#settings") render(); else location.hash = "#settings";
    setTimeout(() => document.getElementById("r-date")?.focus(), 60);
  }else if(act === "newrace"){ raceDraft = null; raceEdit = "new"; render(); document.getElementById("r-dist")?.focus();
  }else if(act === "editrace"){ raceEdit = b.dataset.id; render(); document.getElementById("r-name")?.focus();
  }else if(act === "cancelrace"){ raceEdit = null; render();
  }else if(act === "delrace"){
    const r = state.profile.races.find(x => x.id === b.dataset.id); if(!r) return;
    if(!confirm(`Delete ${raceLabel(r)}?`)) return;
    state.profile.races = state.profile.races.filter(x => x.id !== r.id);
    if(raceEdit === r.id) raceEdit = null;
    raceMsg = `Deleted ${esc(raceLabel(r))}.`; persist(); render();
  }else if(act === "mainrace"){
    state.profile.races.forEach(x => x.main = x.id === b.dataset.id);
    const r = state.profile.races.find(x => x.id === b.dataset.id);
    raceMsg = `${esc(raceLabel(r))} is now your main race. Your plan has been rebuilt around it.`; persist(); render();
  }else if(act === "saverace"){
    const err = document.getElementById("r-err");
    const name = document.getElementById("r-name").value.trim(), dist = document.getElementById("r-dist").value;
    const date = document.getElementById("r-date").value, goal = document.getElementById("r-goal").value.trim();
    const main = document.getElementById("r-main").checked;
    if(!date){ err.textContent = "Pick the race date."; return; }
    if(raceEdit === "new" && date < iso(today0())){ err.textContent = "Pick a date from today onward."; return; }
    if(goal && !(parseDuration(goal) > 10)){ err.textContent = "Enter the goal as h:mm:ss or mm:ss, like 1:45:00."; return; }
    const before = targetRace()?.id;
    let r = raceEdit !== "new" ? state.profile.races.find(x => x.id === raceEdit) : null;
    if(!r){ r = {id:uid()}; state.profile.races.push(r); }
    Object.assign(r, {name, dist, date, goal, main});
    if(main) state.profile.races.forEach(x => { if(x.id !== r.id) x.main = false; });
    syncTarget();
    const nowT = targetRace();
    raceMsg = `Saved ${esc(raceLabel(r))}.` + (nowT && nowT.id === r.id ? (before === r.id ? "" : " Your plan has been rebuilt to build toward it.") : r.date >= iso(today0()) ? " It’ll show in your plan as a tune-up." : "");
    raceEdit = null; persist(); render();
  }else if(act === "saveshoes" || act === "addshoe"){
    const err = document.getElementById("sh-err"), f = unit()==="mi" ? MI : 1, next = [];
    for(const tr of document.querySelectorAll("tr[data-shoe]")){
      const sh = shoeById(tr.dataset.shoe); if(!sh) continue;
      const name = tr.querySelector(".sh-name").value.trim(), start = Number(tr.querySelector(".sh-start").value || 0), ret = Number(tr.querySelector(".sh-retire").value);
      if(!name){ err.textContent = "Every pair needs a name."; return; }
      if(!(start >= 0 && start <= 5000)){ err.textContent = `Check the distance before tracking for ${name}.`; return; }
      if(!(ret >= 50 && ret <= 3000)){ err.textContent = `Set a replace-at distance between 50 and 3000 for ${name}.`; return; }
      next.push([sh, {name, role: tr.querySelector(".sh-role").value, startKm: start*f, retireKm: ret*f}]);
    }
    next.forEach(([sh, v]) => Object.assign(sh, v));
    if(act === "addshoe"){ state.shoes.push({id:uid(), name:"New shoes", role:"easy", startKm:0, retireKm:SHOE_ROLES.easy.life, since:iso(today0()), retired:false}); shoeMsg = "Added a pair. Name it, then save."; }
    else shoeMsg = "Shoes saved.";
    persist(); render();
  }else if(act === "retireshoe"){
    const sh = shoeById(b.dataset.id); if(!sh || !confirm(`Retire ${sh.name}? Its runs stay in your log.`)) return;
    sh.retired = true; shoeMsg = `Retired ${esc(sh.name)}.`; persist(); render();
  }else if(act === "saveprof"){
    const err = document.getElementById("p-err"), val = id => document.getElementById(id).value.trim();
    const num = (id, a, b, label) => { const v = val(id); if(v === "") return null; const n = Number(v); if(!isFinite(n) || n < a || n > b){ throw `${label} should be between ${a} and ${b}.`; } return Math.round(n); };
    try{
      const age = num("p-age", 10, 100, "Age"), maxHr = num("p-max", 120, 230, "Max heart rate"), restHr = num("p-rest", 30, 100, "Resting heart rate");
      const loc = val("p-loc");
      if(!loc){ err.textContent = "Enter a location for the weather forecast."; return; }
      Object.assign(state.profile, {age, maxHr, restHr, location:loc.slice(0,80),
        runDays: Number(document.getElementById("p-days").value) || null,
        runTime: (document.querySelector('input[name="p-time"]:checked') || {}).value === "evening" ? "evening" : "morning",
        units: (document.querySelector('input[name="p-units"]:checked') || {}).value === "mi" ? "mi" : "km"});
      profMsg = "Saved."; persist(); render(); refreshWeather(true);
    }catch(m){ err.textContent = String(m); }
  }else if(act === "rebuild"){
    if(!confirm("Replace the current two weeks with a new plan from your latest runs?")) return;
    state.schedule = null; render();
  }else if(act === "sport"){
    logSport = b.dataset.val === "swim" ? "swim" : "run"; render();
  }else if(act === "addrun" && logSport === "swim"){
    const date = document.getElementById("f-date").value;
    const dIn = parseFloat(document.getElementById("f-dist").value);
    const min = parseDuration(document.getElementById("f-time").value);
    const type = document.getElementById("f-type").value;
    const notes = document.getElementById("f-notes").value.trim();
    const hrRaw = document.getElementById("f-hr").value.trim();
    const hr = hrRaw === "" ? null : Math.round(parseFloat(hrRaw));
    const err = document.getElementById("f-err"), su = unit()==="mi" ? "yd" : "m";
    if(!date || parseD(date) > today0()){ err.textContent = "Pick a date up to today."; return; }
    if(!(dIn >= 25) || dIn > 25000){ err.textContent = `Enter the distance in ${su === "m" ? "metres" : "yards"}, like 1500.`; return; }
    if(!(min > 0) || min > 12*60){ err.textContent = "Enter the time as mm:ss or h:mm:ss, like 32:00."; return; }
    if(hr !== null && !(hr >= 40 && hr <= 230)){ err.textContent = "Enter average heart rate in beats per minute, between 40 and 230."; return; }
    const km = su === "yd" ? dIn*YD : dIn/1000, per100 = min/(km*10);
    if(per100 < .8 || per100 > 8){ err.textContent = `That’s ${swimPace(km, min)} — check the distance and time.`; return; }
    state.runs.push({id:uid(), sport:"swim", date, km:+km.toFixed(4), min:+min.toFixed(3), type, notes, hr});
    persist();
    logMsg = `<span class="ok">Added a ${swimDist(km)} swim at ${swimPace(km, min)}.</span>`;
    render();
  }else if(act === "addrun"){
    const date = document.getElementById("f-date").value;
    const dIn = parseFloat(document.getElementById("f-dist").value);
    const min = parseDuration(document.getElementById("f-time").value);
    const type = document.getElementById("f-type").value;
    const notes = document.getElementById("f-notes").value.trim();
    const hrRaw = document.getElementById("f-hr").value.trim();
    const hr = hrRaw === "" ? null : Math.round(parseFloat(hrRaw));
    const err = document.getElementById("f-err");
    if(!date || parseD(date) > today0()){ err.textContent = "Pick a date up to today."; return; }
    if(!(dIn > 0) || dIn > 200){ err.textContent = "Enter the distance as a number, like 10 or 6.2."; return; }
    const noTime = !document.getElementById("f-time").value.trim();
    if(!noTime && (!(min > 0) || min > 24*60)){ err.textContent = "Enter the time as mm:ss or h:mm:ss, like 52:30, or leave it blank."; return; }
    if(hr !== null && !(hr >= 40 && hr <= 230)){ err.textContent = "Enter average heart rate in beats per minute, between 40 and 230."; return; }
    const km = unit()==="mi" ? dIn*MI : dIn, pace = noTime ? null : min/km;
    if(!noTime && (pace < 2.3 || pace > 20)){ err.textContent = `That’s ${fmtPace(pace)}${paceUnit()} — check the distance and time.`; return; }
    const sel = document.getElementById("f-shoe"), auto = defaultShoeFor(type);
    const shoe = sel && sel.value !== (auto ? auto.id : "none") ? sel.value : ""; // blank = follows the run type automatically
    state.runs.push({id:uid(), sport:"run", date, km:+km.toFixed(3), min: noTime ? null : +min.toFixed(3), type, notes, hr, shoe});
    if(type === "race" && !noTime && (!state.profile.predRef || date > state.profile.predRef)) state.profile.predRef = date; // races update predictions straight away
    persist();
    logMsg = `<span class="ok">Added ${dist(km)} ${unit()}${noTime ? ". With no time, it counts toward your distance and shoes but not your predictions." : ` at ${fmtPace(pace)}${paceUnit()}.`}</span>`;
    render();
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "r-dist" || e.target.id === "r-date") renderSuggestions();
  if(e.target.id === "imp-file" && e.target.files && e.target.files[0]){
    e.target.files[0].text().then(text => {
      let data; try{ data = JSON.parse(text); }catch(err){ dataMsg = "!That file isn’t a Finish Line backup."; render(); return; }
      if(!data || !data.profile || !Array.isArray(data.runs)){ dataMsg = "!That file isn’t a Finish Line backup."; render(); return; }
      if(state.runs.length && !confirm(`Replace what’s on this device with the backup (${data.runs.length} activities)?`)) return;
      state = normalize(data); persist(); dataMsg = `Imported ${state.runs.length} activities, your races, shoes and settings.`; render(); refreshWeather(true);
    }).catch(() => { dataMsg = "!Couldn’t read that file."; render(); });
  }
  if(e.target.id === "strava-range"){ stravaRange = e.target.value; render(); }
  if(e.target.id === "strava-file" && e.target.files && e.target.files[0]) importStravaFile(e.target.files[0]);
  if(e.target.id === "f-type"){ const sel = document.getElementById("f-shoe"), sh = defaultShoeFor(e.target.value); if(sel) sel.value = sh ? sh.id : "none"; }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.closest && e.target.closest("#quicklog") && e.target.tagName === "INPUT"){ e.preventDefault(); document.querySelector('[data-act="quicklog"]').click(); return; }
  if(e.key === "Enter" && e.target.closest && e.target.closest("#profform") && e.target.tagName === "INPUT"){ e.preventDefault(); document.querySelector('[data-act="saveprof"]').click(); return; }
  if(e.key === "Enter" && e.target.closest && e.target.closest("#raceform") && e.target.tagName === "INPUT"){ e.preventDefault(); document.querySelector('[data-act="saverace"]').click(); return; }
  if(e.key === "Enter" && e.target.closest && e.target.closest("#runform") && e.target.tagName === "INPUT"){
    e.preventDefault(); document.querySelector('[data-act="addrun"]').click();
  }
});

render();

/* ---------- weather (Open-Meteo, free, no key) ---------- */
refreshWeather(false);
setInterval(() => refreshWeather(false), 3*3600e3);
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
